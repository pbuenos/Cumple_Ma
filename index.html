      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        overflow-x: hidden;
        background:
          radial-gradient(circle at 12% 18%, #ffe0ed 0 7rem, transparent 7.1rem),
          radial-gradient(circle at 88% 82%, #ffe4c7 0 9rem, transparent 9.1rem),
          linear-gradient(145deg, #fff8fb, #fff1f6 55%, #fff8ef);
      }

      main {
        width: min(100%, 36rem);
        padding: clamp(2rem, 7vw, 3.5rem) clamp(1.25rem, 6vw, 3rem);

        background: rgb(255 255 255 / 88%);
        border: 1px solid rgb(255 255 255 / 95%);

      .confetti {
        margin: 0 0 0.6rem;
        font-size: 3.25rem;
        line-height: 1;

        color: #a53573;
        font-size: clamp(2.4rem, 10vw, 4.5rem);
        line-height: 1.05;
        letter-spacing: -0.06em;
      }

      .message {
        margin: 1rem 0 1.75rem;
        color: #795b72;
        font-size: 1.1rem;
      }

      .tenor-gif-embed {
        width: min(100%, 25rem);
        margin: 0 auto;
        overflow: hidden;
        border-radius: 1.25rem;
      }

      @media (prefers-reduced-motion: no-preference) {
        main {
          animation: arrive 700ms ease-out both;
        }

        @keyframes arrive {
          from {
            opacity: 0;
            transform: translateY(14px);
          }
          to {
            opacity: 1;
            transform: translateY(0);
          }
        }
      }
    </style>
  </head>
